server:
  servlet:
    context-path: /hexagonal
spring:
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/hexagonal
    username: postgres
    password: 852456
  jpa:
    generate-ddl: true
    properties:
      hibernate:
        ddl-auto: update
        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  swagger-ui:
    path: /public/swagger

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 5000